<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register – CraveLoop Dine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow-y: auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fff8f2; color: #3a2b26;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -3;
    background: linear-gradient(270deg, #ffd7b5, #ffac89, #ffbb8f, #ffe9dc);
    background-size: 800% 800%;
    animation: slideBackground 30s ease-in-out infinite; opacity: 0.9;
  }
  @keyframes slideBackground {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(8px);
    z-index: -2; animation: fadeIn 2s ease;
  }
  @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
  .form-container {
    position: relative; z-index: 2;
    width: 600px; max-width: 90%;
    margin: 80px auto 100px; padding: 60px 50px;
    border-radius: 24px; background: rgba(255,255,255,0.15);
    box-shadow: 0 12px 40px rgba(255,180,110,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    text-align: center; backdrop-filter: blur(15px);
    animation: formFadeIn 1s ease forwards;
  }
  @keyframes formFadeIn {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .form-container h2 {
    font-size: 36px; color: #ff8c42; font-weight: 800; margin-bottom: 35px;
    animation: glowText 3s ease-in-out infinite alternate;
  }
  @keyframes glowText {
    0% { text-shadow: 0 0 12px #ff9b45; }
    100% { text-shadow: 0 0 28px #ffbb7e; }
  }
  .form-group { margin-bottom: 24px; text-align: left; }
  label { display: block; font-size: 15px; color: #ffd9b8; margin-bottom: 8px; font-weight: 600; }
  input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
    width: 100%; padding: 14px 15px; border-radius: 10px; border: none;
    font-size: 16px; background: rgba(255,255,255,0.3); color: #663300;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  input:focus { background: rgba(255,255,255,0.6); outline: none; transform: scale(1.05); }
  button {
    width: 100%; padding: 16px; font-size: 20px; font-weight: 700;
    cursor: pointer; border-radius: 12px; border: none; color: white;
    background: linear-gradient(90deg, #ff7b00, #ffb347);
    box-shadow: 0 0 20px rgba(255,184,99,0.7);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: pulseBtn 2.5s infinite alternate;
  }
  button:hover { transform: scale(1.07); box-shadow: 0 0 40px rgba(255,184,99,0.9); }
  .back-btn {
    margin-top: 18px; background: none; border: 2px solid #ff7b00;
    color: #ff7b00; font-weight: bold; font-size: 16px; border-radius: 12px;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .back-btn:hover { background: #ff7b00; color: white; }
  @keyframes pulseBtn {
    0% { box-shadow: 0 0 10px #ff9100; }
    100% { box-shadow: 0 0 30px #ffbf57; }
  }
  .loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #ff7b00;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 10px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @media (max-width: 768px) {
    .form-container { width: 95%; padding: 40px 25px; }
    .form-container h2 { font-size: 28px; }
  }
</style>
</head>
<body>

  <div class="overlay"></div>

  <div class="form-container" role="main">
    <h2>REGISTER</h2>
    <form id="regForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Your Name" required />
      </div>
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="\d{10}" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="address">House Address</label>
        <input type="text" id="address" placeholder="Street, City, State" required />
      </div>
      <div class="form-group">
        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" placeholder="6-digit pincode" pattern="\d{6}" required />
      </div>
      <div class="form-group">
        <label for="password">Set Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
      </div>

      <button type="submit" id="submitBtn">Submit</button>
      <button type="button" class="back-btn" onclick="window.location.href='signin.html'">Back</button>
    </form>
  </div>

<script>
  const form = document.getElementById('regForm');
  const submitBtn = document.getElementById('submitBtn');

  function validatePassword(password) {
    const minLength = 8;
    const hasUppercase = /[A-Z]/.test(password);
    const hasLowercase = /[a-z]/.test(password);
    const hasDigit = /[0-9]/.test(password);
    const hasSpecialChar = /[^A-Za-z0-9]/.test(password);
    return (password.length >= minLength && hasUppercase && hasLowercase && hasDigit && hasSpecialChar);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('mobile').value.trim();
    const email = document.getElementById('email').value.trim();
    const address = document.getElementById('address').value.trim();
    const pincode = document.getElementById('pincode').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!name || !/^\d{10}$/.test(phone) || !/^\S+@\S+\.\S+$/.test(email) || !address || !/^\d{6}$/.test(pincode) || !validatePassword(password) || password !== confirmPassword) {
      alert("⚠️ Please fill all fields correctly.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loader"></span> Registering...';

    try {
      const res = await fetch('http://localhost:5000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, address, pincode, password })
      });

      const data = await res.text();

      if (res.ok) {
        alert('✅ Registration successful!');
        // Save user data to localStorage for AdminUser.html
        const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
        users.push({ name, email, phone, address, pincode });
        localStorage.setItem('registeredUsers', JSON.stringify(users));

        form.reset();
        window.location.href = 'signin.html';
      } else {
        alert('❌ ' + data);
      }

    } catch (err) {
      console.error(err);
      alert('⚠️ Unable to connect to backend. Ensure Node.js server is running.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = "Submit";
    }
  });
</script>

</body>
</html>
