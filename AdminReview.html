<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraveLoop Dine — Admin Review Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4e73df;
    --secondary: #2e59d9;
    --bg-dark: #2c3e50;
    --bg-light: #f8f9fc;
    --text-dark: #5a5c69;
    --text-light: #f8f9fc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

  body {
    background: var(--bg-light);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* Header */
  header {
    background: var(--primary);
    color: var(--text-light);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    animation: fadeInDown 1s ease;
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 600;
  }

  header button {
    background: white;
    color: var(--primary);
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }

  header button:hover {
    background: var(--secondary);
    color: white;
    transform: scale(1.05);
  }

  /* Animation */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Main section */
  main {
    padding: 40px 60px;
    animation: fadeInUp 1s ease forwards;
  }
  main h2 {
    color: var(--primary);
    margin-bottom: 25px;
    font-weight: 600;
    border-bottom: 2px solid var(--primary);
    display: inline-block;
    padding-bottom: 6px;
  }

  /* Review Cards */
  .review-card {
    background: white;
    border-radius: 10px;
    padding: 25px 30px;
    margin-bottom: 25px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    border-left: 5px solid var(--primary);
  }

  .review-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .review-card h3 {
    color: var(--secondary);
    margin: 0 0 10px 0;
    font-weight: 600;
  }

  .review-card p {
    color: #333;
    margin-bottom: 8px;
    font-size: 1rem;
  }

  .review-card small {
    color: #777;
  }

  /* Reply Box */
  .reply-box {
    margin-top: 15px;
    display: flex;
    gap: 10px;
  }

  .reply-box input {
    flex: 1;
    padding: 10px 15px;
    border-radius: 8px;
    border: 1.5px solid #ccc;
    font-size: 0.95rem;
    transition: 0.3s;
  }

  .reply-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 5px rgba(78,115,223,0.4);
    outline: none;
  }

  .reply-box button {
    background: var(--primary);
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .reply-box button:hover {
    background: var(--secondary);
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    padding: 25px;
    background: var(--primary);
    color: white;
    margin-top: 60px;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
    letter-spacing: 0.5px;
  }

  footer span {
    font-weight: 600;
    color: #cfe2ff;
  }

  /* Responsive */
  @media (max-width:768px) {
    main { padding: 20px; }
    header { flex-direction: column; gap: 15px; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <h1>CraveLoop Dine — Admin Review Dashboard 📝</h1>
  <button onclick="window.location.href='AdminHome.html'">🏠 Back to Home</button>
</header>

<main>
  <h2>All User Reviews</h2>
  <div id="adminReviews"></div>
</main>

<footer>© <span>2025 CraveLoop Dine</span> — Admin Panel</footer>

<script>
  const adminReviews = document.getElementById('adminReviews');

  function loadReviews() {
    const reviews = JSON.parse(localStorage.getItem('reviews')) || [];
    adminReviews.innerHTML = reviews.length
      ? reviews.map((r, i) => `
      <div class="review-card">
        <h3>${r.name} (${r.email})</h3>
        <p>${r.review}</p>
        <small>${r.date}</small>
        ${r.reply ? `<p style="color:green;"><b>Admin Reply:</b> ${r.reply}</p>` : ''}
        <div class="reply-box">
          <input type="text" id="reply${i}" placeholder="Type your reply..." value="${r.reply || ''}">
          <button onclick="sendReply(${i})">Send</button>
        </div>
      </div>
      `).join('')
      : `<p style="color:#555;">No reviews yet!</p>`;
  }

  function sendReply(index) {
    const replyInput = document.getElementById(`reply${index}`);
    const replyText = replyInput.value.trim();
    if (!replyText) return alert('Please enter a reply.');
    const reviews = JSON.parse(localStorage.getItem('reviews')) || [];
    reviews[index].reply = replyText;
    localStorage.setItem('reviews', JSON.stringify(reviews));
    loadReviews();
  }

  loadReviews();
</script>
</body>
</html>
