<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Italian Dishes | CraveLoop Dine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #4e73df;
    --secondary: #1cc88a;
    --bg-content: #f8f9fc;
    --text-dark: #333;
  }

  * {margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
  body{background:var(--bg-content);min-height:100vh;color:var(--text-dark);}

  header{
    background:var(--primary);
    color:#fff;
    padding:20px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
  }
  header h1{font-size:1.6rem;}
  header button{
    background:#fff;border:none;padding:8px 14px;border-radius:10px;color:var(--primary);font-weight:700;cursor:pointer;
  }
  main{padding:28px;}

  h2{text-align:center;color:var(--primary);margin-bottom:14px;}

  .dish-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
  }

  .dish-card{
    background:#fff;border-radius:12px;padding:0;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.06);
    transition:transform .25s ease;
  }
  .dish-card:hover{transform:translateY(-6px);}
  .dish-body{padding:14px;}
  .dish-body h3{color:var(--primary);margin-bottom:6px;}
  .dish-body p{color:#555;margin-bottom:8px;font-size:0.95rem;}
  .dish-meta{display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:1px solid #f1f5ff;background:#f7f9ff;}
  .price{font-weight:700;color:#333;}
  .toggle-btn{
    background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer;
  }
  .toggle-btn.paused{background:gray;}

  .add-btn{
    position:fixed;right:26px;bottom:26px;background:var(--secondary);color:#fff;border:none;border-radius:50%;width:58px;height:58px;font-size:26px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);cursor:pointer;
  }

  /* modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);justify-content:center;align-items:center;z-index:999;}
  .modal.active{display:flex;}
  .modal-card{background:#fff;border-radius:12px;padding:18px;width:420px;box-shadow:0 10px 30px rgba(0,0,0,0.18);}
  .modal-card h3{color:var(--primary);margin-bottom:10px;}
  .modal-card input, .modal-card textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:8px;font-size:0.95rem;}
  .modal-card .row{display:flex;gap:8px;}
  .modal-card .row input{flex:1;}
  .modal-card button{background:var(--primary);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;}
  .close-x{position:absolute;top:10px;right:12px;font-size:20px;cursor:pointer;color:#666;}

  footer{text-align:center;padding:16px;margin-top:22px;background:var(--primary);color:#fff;border-radius:6px;}
</style>
</head>
<body>

<header>
  <h1>Admin — Italian Dishes</h1>
  <button onclick="window.location.href='AdminHome.html'">← Back to Admin Home</button>
</header>

<main>
  <h2>Manage Italian Dishes</h2>
  <div class="dish-list" id="dishList"></div>
</main>

<button class="add-btn" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-card">
    <span class="close-x" onclick="closeModal()">&times;</span>
    <h3>Add New Dish</h3>
    <input id="dishName" placeholder="Dish name (e.g. Margherita Pizza)">
    <div class="row">
      <input id="dishPrice" placeholder="Price (₹)" type="number">
      <input id="dishRating" placeholder="Rating (e.g. ★★★★☆)">
    </div>
    <textarea id="dishDesc" rows="3" placeholder="Short description"></textarea>
    <button onclick="addDish()">Add Dish</button>
  </div>
</div>

<footer>© 2025 CraveLoop Dine — Admin Panel 🍝</footer>

<script>
  // default 15 Italian dishes (name, price, description) — exactly as in your italian.html
  const defaultDishes = [
    { name: "Margherita Pizza", price: 400, desc: "Classic Neapolitan pizza with tomato, mozzarella & basil." },
    { name: "Spaghetti Carbonara", price: 450, desc: "Egg-cheese sauce with pancetta and black pepper." },
    { name: "Lasagna", price: 500, desc: "Layered pasta with ragù, béchamel and cheese baked to perfection." },
    { name: "Fettuccine Alfredo", price: 450, desc: "Creamy butter-Parmesan sauce over fettuccine noodles." },
    { name: "Mushroom Risotto", price: 450, desc: "Creamy Arborio rice cooked slowly with mushrooms & broth." },
    { name: "Gnocchi", price: 400, desc: "Soft potato dumplings served with sauce or butter & sage." },
    { name: "Bruschetta", price: 350, desc: "Grilled bread rubbed with garlic, topped with tomato & basil." },
    { name: "Ravioli", price: 400, desc: "Stuffed pasta pockets with cheese, meat or veggie filling." },
    { name: "Eggplant Parmigiana", price: 400, desc: "Baked layers of eggplant, tomato sauce & melted cheese." },
    { name: "Minestrone Soup", price: 300, desc: "Hearty vegetable soup with beans, pasta and herbs." },
    { name: "Osso Buco", price: 500, desc: "Braised veal shanks in wine & broth, served with gremolata." },
    { name: "Pesto Pasta", price: 400, desc: "Fresh basil-pinenut-Parmesan sauce tossed with pasta." },
    { name: "Veal Saltimbocca", price: 450, desc: "Veal with prosciutto & sage, pan-sautéed in wine." },
    { name: "Arancini", price: 350, desc: "Crispy stuffed rice balls with meat, cheese or peas." },
    { name: "Tiramisu", price: 300, desc: "Classic Italian dessert with ladyfingers, coffee, mascarpone." }
  ];

  // localStorage keys
  const STATUS_KEY = 'crave_dishes_status_italian';
  const EXTRAS_KEY = 'italian_extra_dishes';
  const EXTRA_DETAILS = 'italian_extra_details';

  let dishStatus = JSON.parse(localStorage.getItem(STATUS_KEY) || '{}');
  let extraDishes = JSON.parse(localStorage.getItem(EXTRAS_KEY) || '[]');
  let extraDetails = JSON.parse(localStorage.getItem(EXTRA_DETAILS) || '{}');

  const list = document.getElementById('dishList');

  function getAllDishes() {
    // return combined list with objects {name, price, desc}
    const combined = defaultDishes.slice(); // copy
    extraDishes.forEach(name => {
      const d = extraDetails[name] || { price: 0, desc: '' };
      combined.push({ name, price: d.price || 0, desc: d.desc || '' });
    });
    return combined;
  }

  function render() {
    list.innerHTML = '';
    const all = getAllDishes();
    all.forEach(d => {
      const status = dishStatus[d.name] || 'active';
      const card = document.createElement('div');
      card.className = 'dish-card';
      card.innerHTML = `
        <div class="dish-body">
          <h3>${d.name}</h3>
          <p>${d.desc}</p>
        </div>
        <div class="dish-meta">
          <div class="price">₹${d.price}</div>
          <div>
            <button class="toggle-btn ${status==='paused' ? 'paused' : ''}" data-name="${d.name}" onclick="toggleDish('${d.name}')">
              ${status==='paused' ? 'Continue' : 'Pause'}
            </button>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
    // persist status map
    localStorage.setItem(STATUS_KEY, JSON.stringify(dishStatus));
  }

  function toggleDish(name){
    dishStatus[name] = dishStatus[name] === 'paused' ? 'active' : 'paused';
    localStorage.setItem(STATUS_KEY, JSON.stringify(dishStatus));
    render();
    // notify other pages — storage event only fires in other windows, so we dispatch a custom event too
    window.dispatchEvent(new Event('storage'));
    // also dispatch a custom event for same-window pages
    window.dispatchEvent(new Event('italianStatusUpdate'));
  }

  /* Modal handling */
  const modal = document.getElementById('modal');
  function openModal(){ modal.classList.add('active'); }
  function closeModal(){ modal.classList.remove('active'); }

  function addDish(){
    const name = document.getElementById('dishName').value.trim();
    const price = Number(document.getElementById('dishPrice').value) || 0;
    const desc = document.getElementById('dishDesc').value.trim();
    const rating = document.getElementById('dishRating').value.trim();

    if(!name){ alert('Please enter dish name'); return; }
    // add to extras
    if(!extraDishes.includes(name)) extraDishes.push(name);
    extraDetails[name] = { price, desc, rating };
    // save
    localStorage.setItem(EXTRAS_KEY, JSON.stringify(extraDishes));
    localStorage.setItem(EXTRA_DETAILS, JSON.stringify(extraDetails));
    // ensure status active
    dishStatus[name] = 'active';
    localStorage.setItem(STATUS_KEY, JSON.stringify(dishStatus));
    render();
    closeModal();
    document.querySelectorAll('#dishName,#dishPrice,#dishDesc,#dishRating').forEach(i => i.value = '');
    // notify other pages immediately
    window.dispatchEvent(new Event('storage'));
    window.dispatchEvent(new Event('italianStatusUpdate'));
  }

  // initial render
  render();

  // when another window updates storage, re-read
  window.addEventListener('storage', (e) => {
    if (e.key === STATUS_KEY || e.key === EXTRAS_KEY || e.key === EXTRA_DETAILS) {
      dishStatus = JSON.parse(localStorage.getItem(STATUS_KEY) || '{}');
      extraDishes = JSON.parse(localStorage.getItem(EXTRAS_KEY) || '[]');
      extraDetails = JSON.parse(localStorage.getItem(EXTRA_DETAILS) || '{}');
      render();
    }
  });
</script>

</body>
</html>
