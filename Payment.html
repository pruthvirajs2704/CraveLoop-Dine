<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment — CraveLoop Dine</title>

<style>
:root{
  --bg:#fff5ef;
  --card:#fff1e6;
  --accent:#ff7b29;
  --muted:#7b5e42;
  --success:#22c55e;
  font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background: linear-gradient(180deg,#fff8f2 0%, #ffe6d5 100%);
  color:#3b2f2f;
  overflow-x:hidden;
}
.wrap{
  max-width:1200px;
  margin:50px auto;
  padding:40px;
  border-radius:20px;
  background: var(--card);
  box-shadow: 0 12px 35px rgba(255,122,40,0.25);
  display:grid;
  grid-template-columns: 1.3fr 400px;
  gap:28px;
  align-items:start;
  animation: fadeIn 0.6s ease;
}
@keyframes fadeIn {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
header.top{
  grid-column: 1 / -1;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:8px;
}
.brand{display:flex;align-items:center;gap:12px;}
.logo{
  width:60px;height:60px;border-radius:14px;
  background:linear-gradient(135deg,#ff8a3d,#ffb67b);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:24px;
  box-shadow:0 4px 12px rgba(255,122,40,0.4);
}
h1{font-size:22px;margin:0;color:#442d1d;}
.subtitle{color:var(--muted);font-size:14px;text-align:center;}

/* Items */
.items{
  background:#fffaf7;
  padding:20px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-height:400px;
}
.item{
  display:flex;align-items:center;gap:14px;
  background:#fff4eb;
  border:1px solid #ffe0c8;
  padding:12px;
  border-radius:12px;
  transition:transform .2s, box-shadow .2s;
}
.item:hover{
  transform:translateY(-3px);
  box-shadow:0 4px 10px rgba(255,120,20,0.2);
}
.thumb{ width:95px;height:75px;border-radius:10px;overflow:hidden;flex-shrink:0; }
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.meta{flex:1;}
.meta .name{font-weight:600;font-size:16px;}
.meta .desc{color:#9a6b46;font-size:13px;margin-top:4px;}
.price{font-weight:700;color:#2e1e10;font-size:15px;}
.qty-badge{
  display:inline-block;
  margin-top:4px;
  background:#ffe2c5;
  padding:4px 10px;
  border-radius:8px;
  font-size:13px;
  color:#784b28;
}

/* Sidebar */
.sidebar{
  background:#fffaf7;
  border:1px solid #ffd9b5;
  border-radius:18px;
  padding:22px;
}
.summary-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;
  border-bottom:1px dashed #ffe0c8;
  font-size:15px;
}
.summary-row.total{
  font-size:20px;font-weight:700;
  border-bottom:none;margin-top:10px;color:#3b2f2f;
}
input[type="text"], input[type="number"], input[type="tel"]{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #ffd2a8;
  font-size:15px;
  margin-top:6px;
}
.input-group{
  margin-top:14px;
}
.input-group label{
  font-weight:600;
  color:#553829;
  font-size:15px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,#ff7b29,#ffa74d);
  color:#fff;border:none;padding:14px 18px;border-radius:14px;
  font-weight:700;cursor:pointer;
  box-shadow:0 6px 14px rgba(255,120,20,0.25);
  transition:transform .15s ease;
}
.btn:active{transform:translateY(2px);}
.ghost{
  background:transparent;
  border:1px solid #ffc89a;
  color:#c1723c;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.confirm{
  margin-top:20px;
  display:flex;gap:10px;
  align-items:center;justify-content:center;
}

/* QR */
.qr-area{
  margin-top:20px;
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
  opacity:0;transform:translateY(10px);
  transition:all .3s ease;
}
.qr-area.visible{opacity:1;transform:none;}
canvas.qr{
  width:240px;height:240px;
  border-radius:14px;background:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,0.2);
}

/* Modal */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  z-index:1000;
}
.modal.show{opacity:1;pointer-events:auto;}
.modal-card{
  background:#fff9f5;
  border-radius:20px;
  padding:28px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  border:1px solid #ffd1a6;
  animation: popIn .5s ease;
}
@keyframes popIn{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.check{
  width:90px;height:90px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--success),#9ef5bd);
  color:#fff;font-size:40px;margin:0 auto 10px;
}
.conf-title{font-weight:800;font-size:20px;margin-bottom:8px;}
.conf-sub{color:#8a5f3a;font-size:15px;}

@media(max-width:1000px){
  .wrap{grid-template-columns:1fr;padding:22px}
  .sidebar{order:2}
}
</style>
</head>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">CL</div>
      <div>
        <h1>CraveLoop Dine — Payment</h1>
        <div class="subtitle">Review and confirm your order</div>
      </div>
    </div>
  </header>

  <section class="items" id="itemsList"></section>

  <aside class="sidebar">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div><strong>Order Summary</strong></div>
      <div class="subtitle" id="orderCount">0 items</div>
    </div>

    <div style="margin-top:14px">
      <div class="summary-row">
        <div>Subtotal</div><div id="subTotal">₹0</div>
      </div>
      <div class="summary-row">
        <div>Delivery</div><div id="deliveryCharge">₹0</div>
      </div>
      <div class="summary-row total">
        <div>Total</div><div id="grandTotal">₹0</div>
      </div>

      <!-- Name -->
      <div class="input-group">
        <label for="userName">Name</label>
        <input type="text" id="userName" placeholder="Enter your full name" autocomplete="name">
      </div>

      <!-- Mobile number moved up -->
      <div class="input-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" autocomplete="tel">
      </div>

      <div class="input-group">
        <label for="house">House / Address</label>
        <input type="text" id="house" placeholder="Enter your house or address" autocomplete="address-line1">
      </div>

      <div class="input-group">
        <label for="area">Area</label>
        <input type="text" id="area" placeholder="Enter your area" autocomplete="address-level2">
      </div>

      <div class="input-group">
        <label for="pincode">Pincode</label>
        <input type="number" id="pincode" placeholder="Enter your pincode" autocomplete="postal-code">
      </div>

      <div class="confirm">
        <button class="btn" id="confirmBtn">Confirm Order</button>
        <button class="ghost" id="editCartBtn">Edit Cart</button>
      </div>

      <div class="qr-area" id="qrArea">
        <div>Scan to Pay</div>
        <canvas class="qr" id="qrCanvas" width="240" height="240"></canvas>
        <div id="qrHint" class="subtitle">QR generated — scan with UPI</div>
      </div>
    </div>
  </aside>
</div>

<!-- Confirmation Modal -->
<div class="modal" id="modal">
  <div class="modal-card">
    <div class="check">✅</div>
    <div class="conf-title">Order Confirmed</div>
    <div class="conf-sub">Your delicious meal is on its way! 🎉🍽️🚴‍♂️</div>
    <div style="margin-top:12px">
      <button class="btn" onclick="window.location.href='tracking.html'">Track Order</button>
    </div>
  </div>
</div>

<script>
(function(){
  const ITEMS_KEY = 'cartItems';
  let cart = [];

  function seedDemo(){
    const demo = [
      { name: 'Butter Paneer Masala', image: 'https://via.placeholder.com/100x80?text=Paneer', price: 159, qty: 1 },
      { name: 'Tandoori Naan', image: 'https://via.placeholder.com/100x80?text=Naan', price: 59, qty: 2 },
      { name: 'Jeera Rice', image: 'https://via.placeholder.com/100x80?text=Rice', price: 89, qty: 1 }
    ];
    localStorage.setItem(ITEMS_KEY, JSON.stringify(demo));
    return demo;
  }

  function readCart(){
    try{
      const raw = localStorage.getItem(ITEMS_KEY);
      if(!raw) return seedDemo();
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed) || parsed.length===0) return seedDemo();
      return parsed.map(it => ({
        name: it.name,
        image: it.image || 'https://via.placeholder.com/100x80?text=Dish',
        price: Number(it.price),
        qty: Number(it.qty && it.qty > 0 ? it.qty : 1)
      }));
    }catch(e){ return seedDemo(); }
  }

  function formatINR(x){ return '₹'+x.toLocaleString('en-IN'); }

  const DELIVERY_MIN = 20;
  const itemsList = document.getElementById('itemsList');
  const subTotalEl = document.getElementById('subTotal');
  const deliveryEl = document.getElementById('deliveryCharge');
  const grandEl = document.getElementById('grandTotal');
  const orderCountEl = document.getElementById('orderCount');
  const confirmBtn = document.getElementById('confirmBtn');
  const editCartBtn = document.getElementById('editCartBtn');
  const qrArea = document.getElementById('qrArea');
  const qrCanvas = document.getElementById('qrCanvas');
  const modal = document.getElementById('modal');

  cart = readCart();
  renderCart();

  editCartBtn.addEventListener('click', ()=>window.location.href='cart.html');

  // ✅ Press Enter moves to next field
  const fields = ['userName','mobile','house','area','pincode'];
  fields.forEach((id, idx)=>{
    const el = document.getElementById(id);
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const next = document.getElementById(fields[idx+1]);
        if(next) next.focus();
        else confirmBtn.focus();
      }
    });
  });

  confirmBtn.addEventListener('click', async ()=>{
    const userName = document.getElementById('userName').value.trim();
    const house = document.getElementById('house').value.trim();
    const area = document.getElementById('area').value.trim();
    const pincode = document.getElementById('pincode').value.trim();
    const mobile = document.getElementById('mobile').value.trim();

    if(cart.length===0){
      alert('No items in cart!');
      return;
    }
    if(!userName){ alert('Please enter your name.'); return; }
    if(!mobile || !/^[0-9]{10}$/.test(mobile)){ alert('Please enter a valid 10-digit mobile number.'); return; }
    if(!house){ alert('Please enter your house/address.'); return; }
    if(!area){ alert('Please enter your area.'); return; }
    if(!pincode || pincode.length !== 6){ alert('Please enter a valid 6-digit pincode.'); return; }

    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Processing...';
    qrArea.classList.remove('visible');

    await new Promise(res => setTimeout(res, 2000));
    generateFakeQR(qrCanvas);
    qrArea.classList.add('visible');

    setTimeout(()=>{
      modal.classList.add('show');

      const userEmail = localStorage.getItem('userEmail') || 'guest';
      localStorage.setItem('orderConfirmed_' + userEmail, 'true');
      localStorage.removeItem('orderStartTime_' + userEmail);

      const orderDetails = {
        userName, house, area, pincode, mobile,
        items: cart,
        total: grandEl.textContent,
        date: new Date().toLocaleString()
      };
      localStorage.setItem('orderDetails_' + userEmail, JSON.stringify(orderDetails));

      // ✅ Fix: store mobile correctly for AdminOrders
      const adminOrders = JSON.parse(localStorage.getItem('adminOrders') || '[]');
      const newOrder = {
        orderId: 'CLD' + (1000 + adminOrders.length + 1),
        user: userName,
        mobile: mobile,
        address: `${house}, ${area}, ${pincode}`,
        paymentMethod: 'UPI',
        items: cart,
        total: cart.reduce((sum, i)=>sum + i.price*i.qty, 20),
        status: 'Pending',
        date: new Date().toLocaleString()
      };
      adminOrders.push(newOrder);
      localStorage.setItem('adminOrders', JSON.stringify(adminOrders));

      setTimeout(()=>{
        alert('✅ Payment successful! Redirecting to live order tracking...');
        window.location.href = 'tracking.html';
      }, 2000);
    }, 15000);
  });

  function renderCart(){
    itemsList.innerHTML = '';
    let subtotal = 0;
    cart.forEach(it=>{
      subtotal += it.price * it.qty;
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="thumb"><img src="${it.image}" alt="${it.name}"></div>
        <div class="meta">
          <div class="name">${it.name}</div>
          <div class="desc"><span class="qty-badge">Quantity: ${it.qty}</span> × ${formatINR(it.price)}</div>
        </div>
        <div class="price">${formatINR(it.price * it.qty)}</div>
      `;
      itemsList.appendChild(el);
    });
    const delivery = subtotal > 0 ? DELIVERY_MIN : 0;
    const grand = subtotal + delivery;
    subTotalEl.textContent = formatINR(subtotal);
    deliveryEl.textContent = formatINR(delivery);
    grandEl.textContent = formatINR(grand);
    orderCountEl.textContent = `${cart.reduce((a,b)=>a+b.qty,0)} items`;
  }

  function generateFakeQR(canvas){
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    const grid = 25;
    const cell = size / grid;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,size,size);

    function drawFinder(x,y){
      ctx.fillStyle = '#000';
      ctx.fillRect(x,y,cell*7,cell*7);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x+cell,y+cell,cell*5,cell*5);
      ctx.fillStyle = '#000';
      ctx.fillRect(x+cell*2,y+cell*2,cell*2,cell*2);
    }

    drawFinder(0,0);
    drawFinder(size-cell*7,0);
    drawFinder(0,size-cell*7);

    for(let gx=0;gx<grid;gx++){
      for(let gy=0;gy<grid;gy++){
        const px=gx*cell, py=gy*cell;
        if((gx<7&&gy<7)||(gx>grid-8&&gy<7)||(gx<7&&gy>grid-8)) continue;
        if(Math.random()>0.6){
          ctx.fillStyle='#000';
          ctx.fillRect(px,py,cell,cell);
        }
      }
    }
    ctx.fillStyle='#000';
    ctx.font=`${Math.floor(cell*2)}px sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('CL', size/2, size/2);
  }
})();
</script>
</body>
</html>
