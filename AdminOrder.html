<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Orders — CraveLoop Dine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4e73df;
    --secondary: #2e59d9;
    --bg-light: #f8f9fc;
    --text-dark: #5a5c69;
    --text-light: #f8f9fc;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background: var(--bg-light);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  header {
    background: var(--primary);
    color: var(--text-light);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    animation: fadeInDown 1s ease;
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 600;
  }

  header button {
    background: white;
    color: var(--primary);
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    margin-left: 20px;
  }

  header button:hover {
    background: var(--secondary);
    color: white;
    transform: scale(1.05);
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  main {
    padding: 40px 60px;
    animation: fadeInUp 1s ease forwards;
  }

  main h2 {
    color: var(--primary);
    margin-bottom: 25px;
    font-weight: 600;
    border-bottom: 2px solid var(--primary);
    display: inline-block;
    padding-bottom: 6px;
  }

  .order-card {
    background: white;
    border-radius: 10px;
    padding: 25px 30px;
    margin-bottom: 25px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    border-left: 5px solid var(--primary);
  }

  .order-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .order-card h3 {
    color: var(--secondary);
    margin: 0 0 10px 0;
    font-weight: 600;
  }

  .order-card p {
    color: #333;
    margin-bottom: 8px;
    font-size: 1rem;
  }

  .item-row {
    display: flex;
    justify-content: space-between;
    background: #eef1ff;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 6px 0;
    color: #333;
  }

  .total-amount {
    text-align: right;
    margin-top: 10px;
    font-weight: 600;
    color: var(--secondary);
  }

  .status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }

  .status.pending {
    background: rgba(255,193,7,0.2);
    color: #b38b00;
  }

  .status.delivered {
    background: rgba(76,175,80,0.2);
    color: #2e7d32;
  }

  .status.processing {
    background: rgba(0, 123, 255, 0.2);
    color: #004085;
  }

  footer {
    text-align: center;
    padding: 25px;
    background: var(--primary);
    color: white;
    margin-top: 60px;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
    letter-spacing: 0.5px;
  }

  footer span {
    font-weight: 600;
    color: #cfe2ff;
  }

  .clear-btn {
    background: crimson;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }

  .clear-btn:hover {
    background: darkred;
    transform: scale(1.05);
  }

  .header-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>CraveLoop Dine — Admin Orders Dashboard 🧾</h1>
  <div class="header-actions">
    <button onclick="window.location.href='AdminHome.html'">🏠 Back to Home</button>
    <button class="clear-btn" onclick="clearAllOrders()">🗑️ Clear All Orders</button>
  </div>
</header>

<main>
  <h2>All Confirmed Orders</h2>
  <div id="ordersList"></div>
</main>

<footer>© <span>2025 CraveLoop Dine</span> — Admin Panel</footer>

<script>

function loadOrders() {
  const adminOrders = JSON.parse(localStorage.getItem('adminOrders') || '[]');
  const container = document.getElementById('ordersList');

  if (!adminOrders.length) {
    container.innerHTML = '<p style="color:#777;">No confirmed orders yet!</p>';
    return;
  }

  container.innerHTML = adminOrders.map((o, i) => {
    const itemsHTML = (o.items || []).map(it => {
      const price = parseFloat(it.price) || 0;
      const qty = parseInt(it.qty) || 0;
      return `
        <div class="item-row">
          <span>${it.name || 'Unnamed Item'} × ${qty}</span>
          <span>₹${(price * qty).toFixed(2)}</span>
        </div>
      `;
    }).join('');

    const total = (o.total && !isNaN(o.total)) ? o.total : 
      (o.items || []).reduce((sum, it) => sum + ((parseFloat(it.price) || 0) * (parseInt(it.qty) || 0)), 0);

    const statusClass = (o.status?.toLowerCase() || 'pending');
    const statusText = o.status || 'Pending';

    return `
      <div class="order-card">
        <h3>Order ID: ${o.orderId || `#CL${1000 + i}`}</h3>
        <p><strong>User:</strong> ${o.user || 'Unknown User'}</p>
        <p><strong>Phone:</strong> ${o.mobile || 'N/A'}</p>
        <p><strong>Address:</strong> ${o.address || 'Not Provided'}</p>
        <p><strong>Payment Method:</strong> ${o.paymentMethod || 'UPI'}</p>
        <p><small>Date: ${o.date || new Date().toLocaleString()}</small></p>
        ${itemsHTML}
        <p class="total-amount">Total: ₹${total.toFixed(2)}</p>
        <p>Status: <span class="status ${statusClass}">${statusText}</span></p>
      </div>
    `;
  }).join('');
}


window.addEventListener('storage', (event) => {

  if (event.key === 'adminOrders') {
    const updatedOrders = JSON.parse(localStorage.getItem('adminOrders') || '[]');
    const deliveredOrders = updatedOrders.filter(o => o.status === 'Delivered');
    if (deliveredOrders.length > 0) {
      
      const lastDelivered = deliveredOrders[deliveredOrders.length - 1];
      alert(`✅ Order for ${lastDelivered.user || 'a customer'} has been delivered!`);
    }
    loadOrders();
  }
});


setInterval(loadOrders, 10000);


function clearAllOrders() {
  if (confirm("Are you sure you want to clear all confirmed orders?")) {
    localStorage.removeItem('adminOrders');
    loadOrders();
  }
}


loadOrders();
</script>

</body>
</html>
